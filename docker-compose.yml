services:
  shopnest:
    build: .
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - shopnest-data:/app/data
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATA_DIR: /app/data
    init: true
    restart: unless-stopped

volumes:
  shopnest-data:
